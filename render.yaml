services:
  # Вариант 1: Бесплатный Web Service на Render.com (Free Tier)
  # Бот поднимает легковесный HTTP-эндпоинт /health на порту $PORT,
  # благодаря чему Render Free Tier разворачивает его бесплатно.
  - type: web
    name: vinyl-eval-bot
    env: docker
    region: frankfurt
    plan: free
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        value: 8529165360:AAF-L_DTZ3f6S-hppJNzaW9X4pqMtWUJe_c
      - key: AITUNNEL_KEY
        value: sk-aitunnel-qeuouwWXHwYtJmmartJ6xlCEvSbAEBaG
      - key: AITUNNEL_URL
        value: https://api.aitunnel.ru/v1/chat/completions
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DEBOUNCE_DELAY
        value: "2.8"
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_NAME
        value: Винил
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
